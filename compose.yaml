name: war2glory

services:
  game-server:
    image: ghcr.io/bavxhack/war2glory:latest
    restart: unless-stopped
    command:
      - --world
      - ${WORLD_NAME:-alpha}
      - --port
      - "3000"
      - --host
      - 0.0.0.0
    environment:
      ALLIANCE_CREATE_WOOD: ${ALLIANCE_CREATE_WOOD-1000}
      ALLIANCE_CREATE_STONE: ${ALLIANCE_CREATE_STONE-1000}
      ALLIANCE_MAX_MEMBERS: ${ALLIANCE_MAX_MEMBERS-20}
      ALLIANCE_INVITE_TTL_HOURS: ${ALLIANCE_INVITE_TTL_HOURS-168}
      FIELD_DEFENDER_MIN: ${FIELD_DEFENDER_MIN-5}
      FIELD_DEFENDER_MAX: ${FIELD_DEFENDER_MAX-30}
      CITY_CLAIM_TTL_HOURS: ${CITY_CLAIM_TTL_HOURS-24}
      CITY_FOUND_WOOD: ${CITY_FOUND_WOOD-500}
      CITY_FOUND_STONE: ${CITY_FOUND_STONE-500}
      CITY_FOUND_FOOD: ${CITY_FOUND_FOOD-500}
      WORLD_WIDTH: ${WORLD_WIDTH-24}
      WORLD_HEIGHT: ${WORLD_HEIGHT-24}
      WORLD_NPC_COUNT: ${WORLD_NPC_COUNT-18}
      UPKEEP_TRUCK_PER_HOUR: ${UPKEEP_TRUCK_PER_HOUR-180}
      OIL_INFANTRY_PER_FIELD: ${OIL_INFANTRY_PER_FIELD-0.1}
      OIL_SCOUT_PER_FIELD: ${OIL_SCOUT_PER_FIELD-0.2}
      OIL_TRUCK_PER_FIELD: ${OIL_TRUCK_PER_FIELD-1}
      MAX_ATTACK_DELAY_MINUTES: ${MAX_ATTACK_DELAY_MINUTES-1440}
      GENERAL_TRANSFER_OIL_PER_FIELD: ${GENERAL_TRANSFER_OIL_PER_FIELD-0.1}
      GENERAL_TRANSFER_FUEL_CAPACITY: ${GENERAL_TRANSFER_FUEL_CAPACITY-20}
      SCOUT_FUEL_CAPACITY: ${SCOUT_FUEL_CAPACITY-20}
      TRUCK_CARGO_CAPACITY: ${TRUCK_CARGO_CAPACITY-200}
      UPKEEP_INFANTRY_PER_HOUR: ${UPKEEP_INFANTRY_PER_HOUR-360}
      UPKEEP_SCOUT_PER_HOUR: ${UPKEEP_SCOUT_PER_HOUR-180}
      SUPPLY_GRACE_SECONDS: ${SUPPLY_GRACE_SECONDS-1800}
      SUPPLY_LOSS_INTERVAL_SECONDS: ${SUPPLY_LOSS_INTERVAL_SECONDS-300}
      SUPPLY_LOSS_PERCENT: ${SUPPLY_LOSS_PERCENT-5}
      SUPPLY_RECOVERY_SECONDS: ${SUPPLY_RECOVERY_SECONDS-60}
      GENERAL_MAX_COUNT: ${GENERAL_MAX_COUNT-3}
      GENERAL_RECRUIT_WOOD: ${GENERAL_RECRUIT_WOOD-500}
      GENERAL_RECRUIT_STONE: ${GENERAL_RECRUIT_STONE-500}
      GENERAL_RECRUIT_COST_EXPONENT: ${GENERAL_RECRUIT_COST_EXPONENT-2}
      GENERAL_CANDIDATE_REFRESH_HOURS: ${GENERAL_CANDIDATE_REFRESH_HOURS-24}
      RESEARCH_CONSTRUCTION_BONUS_BPS: ${RESEARCH_CONSTRUCTION_BONUS_BPS-500}
      RESEARCH_TRAINING_BONUS_BPS: ${RESEARCH_TRAINING_BONUS_BPS-500}
      RESEARCH_LOADING_BONUS_BPS: ${RESEARCH_LOADING_BONUS_BPS-500}
      RESEARCH_LEADERSHIP_PERCENT: ${RESEARCH_LEADERSHIP_PERCENT-1}
      RESEARCH_BONUS_CAP_PERCENT: ${RESEARCH_BONUS_CAP_PERCENT-50}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - game-data:/app/data

volumes:
  game-data:
